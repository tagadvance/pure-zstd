name: pure_zstd
description: >-
  A zstd decompressor written in plain Dart. Decodes RFC 8878 frames with no
  native library and no platform channel, verified against libzstd.
version: 0.1.0

repository: https://github.com/tagadvance/pure-zstd
issue_tracker: https://github.com/tagadvance/pure-zstd/issues

# Remove this line to publish. A published version can be retracted but never
# deleted, so it stays until the first release is deliberate.
publish_to: none

topics:
  - zstd
  - zstandard
  - compression
  - decompression

environment:
  sdk: ^3.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
