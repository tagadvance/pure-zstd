name: pure_zstd
description: >-
  A zstd decompressor written in plain Dart. Decodes RFC 8878 frames with no
  native library and no platform channel, verified against libzstd.
version: 0.1.0

repository: https://github.com/tagadvance/pure-zstd
issue_tracker: https://github.com/tagadvance/pure-zstd/issues

topics:
  - zstd
  - zstandard
  - compression
  - decompression

# Not the web: the bit reader carries 56 bits in an int, and XXH64 relies on
# 64-bit multiplication wrapping, neither of which holds under JavaScript.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
